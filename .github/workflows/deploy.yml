name: Compilar C (Raylib) a WebAssembly

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Compilar C a WebAssembly
        run: |
          emcc calculadora_final.c -o index.html \
            -s USE_RAYLIB=1 \
            -s EXPORTED_FUNCTIONS='["_main", "_ActualizarNombreDesdeJS", "_EnviarAGoogleSheets"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall", "UTF8ToString"]' \
            --shell-file shell_minimal.html \
            --preload-file recursos \
            --preload-file fondo.jpg

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
