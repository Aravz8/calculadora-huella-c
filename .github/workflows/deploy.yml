name: Compilar C (Raylib) a WebAssembly

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Emscripten
        uses: mymindstorm/setup-emsdk@v13
        with:
          version: 3.1.50

      - name: Clonar Raylib fuente
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git raylib_src
          cd raylib_src/src
          make PLATFORM=PLATFORM_WEB -e

      - name: Compilar C a WASM
        run: |
          emcc calculadora_final.c -o index.html -Os -Wall -I raylib_src/src -L raylib_src/src -lraylib -s USE_GLFW=3 -s ASYNCIFY --preload-file recursos

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefactos web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
