name: Compilar C (Raylib) a WebAssembly

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Emscripten
        uses: mymindstorm/setup-emsdk@v13
        with:
          version: 3.1.50

      - name: Descargar Raylib para Web
        run: |
          wget https://github.com/raysan5/raylib/releases/download/5.0/raylib-5.0_webassembly.tar.gz
          tar -xvf raylib-5.0_webassembly.tar.gz

      - name: Compilar C a WASM
        run: |
          emcc calculadora_final.c -o index.html -Os -Wall -I raylib-5.0_webassembly/include -L raylib-5.0_webassembly/lib -lraylib -s USE_GLFW=3 -s ASYNCIFY --preload-file recursos

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefactos web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
