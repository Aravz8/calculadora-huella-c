<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora de Huella de Carbono</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* Fondo solido navy, sin patron de hojas */
            background-color: #2d4059;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fallback para navegadores sin soporte de dvh */
            min-height: 100vh;
            height: 100vh;
            /* dvh descuenta correctamente la barra de direcciones dinamica
               de Android/iOS; sobreescribe el vh de arriba cuando esta soportado */
            min-height: 100dvh;
            height: 100dvh;
            overflow: hidden;
        }
        /* Contenedor adaptativo:
           En móviles ocupa alto relativo. En PC/Monitores limita la altura máxima
           para mantener la apariencia de tarjeta sin estirarse demasiado. */
        #contenedor-app {
            position: relative;
            height: 92vh;
            height: 92dvh;
            max-height: 750px;
            max-width: 95vw;
            aspect-ratio: 420 / 800;
        }
        /* Ajuste específico para Monitores / Pantallas de escritorio */
        @media (min-width: 768px) {
            #contenedor-app {
                height: 90vh;
                height: 90dvh;
                max-height: 960px;
            }
            canvas.emscripten {
                border: 1px solid rgba(217, 210, 154, 0.5);
            }
        }
        canvas.emscripten {
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-radius: 16px;
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: -webkit-optimize-contrast;
        }
        /* Input invisible para el teclado virtual: cubre TODO el campo de
           nombre, para que escribir y corregir con backspace funcione en
           cualquier punto del campo (antes se angostaba para dejarle
           espacio al boton 'x', pero eso dejaba una franja del campo sin
           input encima, donde el clic no daba foco). */
        #input-nombre {
            position: absolute;
            left: 9.52%;
            top: 38.75%;
            width: 80.95%;
            height: 5.5%;
            opacity: 0;
            border: none;
            font-size: 16px; /* Evita zoom automático en iOS */
            background: transparent;
        }

        /* Boton real de "limpiar nombre": va POR ENCIMA del input invisible
           (mas adelante en el DOM = mayor prioridad de clic), posicionado
           sobre la "x" que dibuja Raylib, con una zona de toque mas grande
           (40x40 logicos) que el icono visual (28x28). */
        #btn-borrar-nombre {
            position: absolute;
            left: 80.48%;
            top: 39%;
            width: 9.52%;
            height: 5%;
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        /* Envoltorio de las dos columnas (panel decorativo + app) */
        #app-wrapper {
            display: flex;
            align-items: stretch;
        }

        /* Panel decorativo de escritorio: oculto en movil (por defecto,
           arriba). En pantallas >=768px se muestra siempre, en las 4
           pantallas de la app (Intro, Bienvenida, Formulario, Resultado),
           ya que el canvas de Raylib no sabe nada de esto -- es puramente
           un elemento HTML/CSS al lado del canvas. */
        #panel-desktop {
            display: none;
        }
        @media (min-width: 768px) {
            #panel-desktop {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: flex-start;
                gap: 14px;
                width: 340px;
                background: #12294F;
                background-image: radial-gradient(circle at 25% 12%, rgba(240, 123, 63, 0.16), transparent 42%);
                padding: 40px 32px;
                border-radius: 16px 0 0 16px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            }
            #panel-desktop img {
                width: 168px;
                height: 168px;
                object-fit: contain;
                margin-bottom: 4px;
            }
            #panel-desktop h2 {
                font-size: 17px;
                font-weight: 700;
                color: #FFFFFF;
                margin: 0;
                line-height: 1.3;
            }
            #panel-desktop p {
                font-size: 12.5px;
                color: #F9F5EB;
                opacity: 0.75;
                margin: 0;
                line-height: 1.5;
            }
            #panel-desktop .puntos {
                display: flex;
                gap: 6px;
                margin-top: 4px;
            }
            #panel-desktop .puntos span {
                width: 8px;
                height: 8px;
                border-radius: 50%;
            }
            /* El panel siempre esta presente en desktop, asi que el canvas
               pierde el redondeado izquierdo para verse como una sola
               tarjeta continua junto al panel */
            canvas.emscripten {
                border-radius: 0 16px 16px 0;
            }
        }
    </style>
</head>
<body>
    <div id="app-wrapper">
        <div id="panel-desktop">
            <img src="recursos/cobi_bienvenida.png" alt="COBI saludando">
            <h2>Calculadora de Huella<br>de Carbono Personal</h2>
            <p>Descubre tu impacto ambiental diario respondiendo 7 preguntas rápidas sobre transporte, agua, electricidad y más.</p>
            <div class="puntos">
                <span style="background:#EA5455"></span>
                <span style="background:#F07B3F"></span>
                <span style="background:rgba(249,245,235,0.4)"></span>
            </div>
        </div>
        <div id="contenedor-app">
            <canvas class="emscripten" id="canvas" style="touch-action: none;" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
            <input type="text" id="input-nombre" maxlength="31" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <button type="button" id="btn-borrar-nombre" aria-label="Borrar nombre"></button>
        </div>
    </div>
    <script type='text/javascript'>
        var Module = {
            preRun: [],
            postRun: [],
            print: (function() {})(),
            canvas: (function() {
                var canvas = document.getElementById('canvas');

                // Previene scroll nativo y gestos del navegador al tocar el canvas en Android/iOS
                ['touchstart', 'touchend', 'touchmove'].forEach(function(evt) {
                    canvas.addEventListener(evt, function(e) {
                        e.preventDefault();
                    }, { passive: false });
                });
                return canvas;
            })()
        };
        /* Puente de teclado móvil hacia C */
        var inputNombre = document.getElementById('input-nombre');
        inputNombre.addEventListener('input', function () {
            if (window.Module && Module.ccall) {
                Module.ccall('ActualizarNombreDesdeJS', null, ['string'], [inputNombre.value]);
            }
        });

        /* Boton real de limpiar nombre: vacia el input real y dispara el
           mismo evento 'input' de arriba, para no tener dos sistemas de
           estado (el input HTML y la variable en C) desincronizados. */
        var btnBorrarNombre = document.getElementById('btn-borrar-nombre');
        btnBorrarNombre.addEventListener('click', function () {
            inputNombre.value = '';
            inputNombre.dispatchEvent(new Event('input'));
            inputNombre.focus();
        });
    </script>
    {{{ SCRIPT }}}
</body>
</html>
