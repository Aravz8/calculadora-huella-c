<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora de Huella de Carbono</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #e8e2c4;
            background-image: url('fondo.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenedor corregido para coincidir con InitWindow(800, 720) de Raylib */
        #contenedor-app {
            position: relative;
            width: 100%;
            max-width: 800px;
            max-height: 92vh;
            aspect-ratio: 800 / 720;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas.emscripten {
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-radius: 16px;
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        /* Input invisible re-alineado para resolución de 800x720 */
        #input-nombre {
            position: absolute;
            left: 30%;
            top: 41.6%;
            width: 40%;
            height: 6.9%;
            opacity: 0;
            border: none;
            font-size: 16px;
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="contenedor-app">
        <canvas class="emscripten" id="canvas" style="touch-action: none;" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <input type="text" id="input-nombre" maxlength="31" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>

    <script type='text/javascript'>
        var Module = {
            preRun: [],
            postRun: [],
            print: (function() {})(),
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                return canvas;
            })()
        };

        /* Puente de teclado para movil */
        var inputNombre = document.getElementById('input-nombre');
        inputNombre.addEventListener('input', function () {
            if (window.Module && Module.ccall) {
                Module.ccall('ActualizarNombreDesdeJS', null, ['string'], [inputNombre.value]);
            }
        });
    </script>
    {{{ SCRIPT }}}
</body>
</html>
