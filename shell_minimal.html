<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora de Huella de Carbono</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* Fondo kaki con el patron de hojas dispersas */
            background-color: #e8e2c4;
            background-image: url('fondo.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
        }
        /* Contenedor adaptativo:
           En móviles ocupa alto relativo. En PC/Monitores limita la altura máxima
           para mantener la apariencia de tarjeta sin estirarse demasiado. */
        #contenedor-app {
            position: relative;
            height: 92vh;
            max-height: 750px;
            max-width: 95vw;
            aspect-ratio: 420 / 800;
        }

        /* Ajuste específico para Monitores / Pantallas de escritorio */
        @media (min-width: 768px) {
            #contenedor-app {
                height: 85vh;
                max-height: 780px;
            }
            canvas.emscripten {
                border: 1px solid rgba(217, 210, 154, 0.5);
            }
        }

        canvas.emscripten {
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-radius: 16px;
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: -webkit-optimize-contrast;
        }

        /* Input invisible para el teclado virtual */
        #input-nombre {
            position: absolute;
            left: 9.52%;
            top: 38.75%;
            width: 80.95%;
            height: 5.5%;
            opacity: 0;
            border: none;
            font-size: 16px; /* Evita zoom automático en iOS */
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="contenedor-app">
        <canvas class="emscripten" id="canvas" style="touch-action: none;" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <input type="text" id="input-nombre" maxlength="31" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <script type='text/javascript'>
        var Module = {
            preRun: [],
            postRun: [],
            print: (function() {})(),
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                
                // Previene scroll nativo y gestos del navegador al tocar el canvas en Android/iOS
                ['touchstart', 'touchend', 'touchmove'].forEach(function(evt) {
                    canvas.addEventListener(evt, function(e) {
                        e.preventDefault();
                    }, { passive: false });
                });

                return canvas;
            })()
        };

        /* Puente de teclado móvil hacia C */
        var inputNombre = document.getElementById('input-nombre');
        inputNombre.addEventListener('input', function () {
            if (window.Module && Module.ccall) {
                Module.ccall('ActualizarNombreDesdeJS', null, ['string'], [inputNombre.value]);
            }
        });
    </script>
    {{{ SCRIPT }}}
</body>
</html>
